name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, personal data, or session logs."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide a commit SHA or release tag.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets before posting logs.
